[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mfg-oc-scaffold"
version = "0.1.0"
description = "Reference scaffold for the MFG overconfidence simulation."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "yfinance>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
